version: "2"
linters:
  enable:
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - errorlint
    - exhaustive
    - forbidigo
    - gochecknoinits
    - goconst
    - gocritic
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - importas
    - lll
    - makezero
    - misspell
    - modernize
    - nakedret
    - nestif
    - nilnil
    - nlreturn
    - nolintlint
    - predeclared
    - promlinter
    - revive
    - staticcheck
    - testpackage
    - thelper
    - unconvert
    - unparam
    - usetesting
    - whitespace
    - wrapcheck
    - wsl_v5
  settings:
    goconst:
      # Test-file issues are already excluded below; don't let test
      # literals inflate the occurrence counts for production code
      # either.
      ignore-tests: true
    godox:
      keywords:
        - FIXME
        - BUG
    exhaustive:
      # A default case is the deliberate "everything else is handled the
      # same" answer; spelling out seventeen twirp codes that share one
      # message would only rot.
      default-signifies-exhaustive: true
    modernize:
      disable:
        # embedlit suggests eliding the type of an embedded field in a
        # struct literal, which the Go 1.27 compiler rejects with "missing
        # type in composite literal".
        - embedlit
    nestif:
      min-complexity: 6
    wrapcheck:
      extra-ignore-sigs:
        # The elephantine/rpc helpers construct RPC errors. Wrapping one would
        # bury the code the handler picked, which is the whole point of it.
        - github.com/ttab/elephantine/rpc.
        - elephantine.InvalidArgumentf(
        - (context.Context).Err(
        - github.com/ttab/elephantine/pg.WithTX(
        - github.com/ttab/elephantine/pg/joblock.Lock).RunWithContext(
        - github.com/ttab/howdah.NewHTTPError(
        - github.com/ttab/howdah.InternalHTTPError(
        - github.com/ttab/howdah.LiteralHTTPError(
        - github.com/ttab/howdah.Authenticator).RequireAuth(
  exclusions:
    generated: lax
    rules:
      - linters:
          - goconst
          - gosec
        path: _test\.go
      # This is a spellchecker, so its tests are full of deliberate
      # misspellings, as input and as expected output. misspell --fix
      # silently rewrites them into correct words, which leaves the test
      # asserting nothing and still passing. It must not run here.
      - linters:
          - misspell
        path: _test\.go
      # A test that checks what the server answered passes the RPC error
      # through verbatim; wrapping it would only get in the way.
      - linters:
          - wrapcheck
        path: _test\.go
      # cgo attributes the diagnostics it finds in its generated wrappers
      # back to the calling line, at columns past the end of it, so these
      # report on code nobody here wrote and cannot edit.
      - linters:
          - gocritic
          - nlreturn
        path: hunspell/hunspell\.go
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  # The defaults cap a linter at 50 findings and the same finding at 3, which
  # hides work rather than saving any.
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
